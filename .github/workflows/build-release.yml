name: Build and Publish Release APKs

# The phone app is built from react-app/ (Expo / React Native).  The Wear OS companion is still
# built from the Kotlin :wear module, because the React app has no watch app of its own — it
# syncs to it over the Wearable Data Layer.
#
# react-app/android is generated by "npx expo prebuild", so this workflow regenerates it from
# scratch on every run.  Any native change must live in a config plugin under
# react-app/plugins/, never in the generated Gradle files.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.0.0). Defaults to the version in react-app/app.json.'
        required: false
        default: ''
      build_target:
        description: 'react = React Native app (default). kotlin = legacy Kotlin app, opt-in only.'
        required: false
        type: choice
        default: react
        options:
          - react
          - kotlin
      architectures:
        description: 'ABIs to package in the React APK. Add x86,x86_64 for emulator testing.'
        required: false
        default: 'arm64-v8a,armeabi-v7a'

permissions:
  contents: write

jobs:
  build-and-publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew react-app/android/gradlew

      # ---------------------------------------------------------------------------------------------
      # Version: react-app/app.json is the single source of truth for the phone app.
      # gradle.properties is only consulted on the legacy Kotlin path.
      # ---------------------------------------------------------------------------------------------
      - name: Determine version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BUILD_TARGET: ${{ inputs.build_target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          BUILD_TARGET="$INPUT_BUILD_TARGET"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ -z "$BUILD_TARGET" ]; then
            BUILD_TARGET="react"
          fi

          if [ "$BUILD_TARGET" = "react" ]; then
            VERSION_NAME=$(jq -r '.expo.version' react-app/app.json)
            VERSION_CODE=$(jq -r '.expo.android.versionCode' react-app/app.json)
          else
            VERSION_NAME=$(grep -Po '(?<=APP_VERSION_NAME=).+' gradle.properties)
            VERSION_CODE=$(grep -Po '(?<=APP_VERSION_CODE=).+' gradle.properties)
          fi

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ] || [ "$VERSION_NAME" = "null" ]; then
            echo "::error::Could not resolve the version for build target '$BUILD_TARGET'." >&2
            exit 1
          fi

          TAG="${INPUT_TAG:-$REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v${VERSION_NAME}"
          fi

          # A release must never be published under a tag that disagrees with the build.
          if [ "$BUILD_TARGET" = "react" ] && [ "$TAG" != "v${VERSION_NAME}" ]; then
            echo "::error::Tag $TAG does not match react-app/app.json version v${VERSION_NAME}." >&2
            echo "::error::Update app.json (expo.version / expo.android.versionCode) or retag." >&2
            exit 1
          fi

          WEAR_VERSION_CODE=$(( VERSION_CODE * 10 + 1 ))

          echo "Build target : ${BUILD_TARGET}"
          echo "Version      : ${VERSION_NAME} (build ${VERSION_CODE})"
          echo "Wear build   : ${WEAR_VERSION_CODE}"
          echo "Tag          : ${TAG}"

          echo "build_target=${BUILD_TARGET}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "wear_version_code=${WEAR_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------------------------------
      # React Native phone app
      # ---------------------------------------------------------------------------------------------
      - name: Install React app dependencies
        if: steps.version.outputs.build_target == 'react'
        working-directory: react-app
        run: npm ci

      - name: Generate the React Native Android project
        if: steps.version.outputs.build_target == 'react'
        working-directory: react-app
        run: npx expo prebuild --platform android --no-install --clean

      - name: Point the generated project at the Android SDK
        if: steps.version.outputs.build_target == 'react'
        run: |
          # prebuild --clean regenerates android/, so sdk.dir is written fresh for this run.
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=${ANDROID_HOME}" > react-app/android/local.properties
          else
            echo "::error::ANDROID_HOME is not set on this runner." >&2
            exit 1
          fi

      - name: Build the React Native phone release APK
        if: steps.version.outputs.build_target == 'react'
        working-directory: react-app/android
        env:
          # Selects the GitHub distribution: in-app updater enabled, "GitHub" on the About page.
          EXPO_PUBLIC_DISTRIBUTION_CHANNEL: github
          EXPO_PUBLIC_LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          EXPO_PUBLIC_LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          # Defaults to the 32/64-bit ARM ABIs every physical Android device uses.  A tag push
          # has no inputs, so the fallback below keeps the build deterministic.
          ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a,armeabi-v7a' }}
        run: |
          set -euo pipefail
          echo "Packaging ABIs: ${ARCHITECTURES}"
          ./gradlew :app:assembleGithubRelease \
            -PreactNativeArchitectures="$ARCHITECTURES" \
            -Pexpo.useLegacyPackaging=true \
            -Pandroid.enableBundleCompression=true

      # ---------------------------------------------------------------------------------------------
      # Wear OS companion — still built from the Kotlin :wear module
      # ---------------------------------------------------------------------------------------------
      - name: Decode the Wear release keystore (if configured)
        id: wear_keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p /tmp/keystores
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/keystores/release.jks
            chmod 600 /tmp/keystores/release.jks
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "store_file=/tmp/keystores/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the Wear OS release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          GRADLE_ARGS=(
            ":wear:assembleRelease"
            "-PAPP_VERSION_NAME=${{ steps.version.outputs.version_name }}"
            "-PAPP_VERSION_CODE=${{ steps.version.outputs.version_code }}"
            "-PWEAR_VERSION_CODE=${{ steps.version.outputs.wear_version_code }}"
            "-PLASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            "-PLASTFM_API_SECRET=${{ secrets.LASTFM_API_SECRET }}"
          )

          if [ "${{ steps.wear_keystore.outputs.has_signing }}" = "true" ]; then
            GRADLE_ARGS+=(
              "-PRELEASE_STORE_FILE=${{ steps.wear_keystore.outputs.store_file }}"
              "-PRELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
              "-PRELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
              "-PRELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
            )
          fi

          ./gradlew "${GRADLE_ARGS[@]}"

      # ---------------------------------------------------------------------------------------------
      # Legacy Kotlin phone app (opt-in via workflow_dispatch)
      # ---------------------------------------------------------------------------------------------
      - name: Build the legacy Kotlin phone release APK
        if: steps.version.outputs.build_target == 'kotlin'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          GRADLE_ARGS=(
            ":app:assembleGithubRelease"
            "-PAPP_VERSION_NAME=${{ steps.version.outputs.version_name }}"
            "-PAPP_VERSION_CODE=${{ steps.version.outputs.version_code }}"
            "-PWEAR_VERSION_CODE=${{ steps.version.outputs.wear_version_code }}"
            "-PPODCAST_API_BASE_URL=https://bbc-radio.shai.website"
            "-PLASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            "-PLASTFM_API_SECRET=${{ secrets.LASTFM_API_SECRET }}"
          )

          if [ "${{ steps.wear_keystore.outputs.has_signing }}" = "true" ]; then
            GRADLE_ARGS+=(
              "-PRELEASE_STORE_FILE=${{ steps.wear_keystore.outputs.store_file }}"
              "-PRELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
              "-PRELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
              "-PRELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
            )
          fi

          ./gradlew "${GRADLE_ARGS[@]}"

      # ---------------------------------------------------------------------------------------------
      # Release assets
      # ---------------------------------------------------------------------------------------------
      - name: Prepare release assets
        id: assets
        env:
          BUILD_TARGET: ${{ steps.version.outputs.build_target }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          if [ "$BUILD_TARGET" = "react" ]; then
            PHONE_APK=$(find react-app/android/app/build/outputs/apk/github/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' | sort | head -1 || true)
          else
            PHONE_APK=$(find app/build/outputs/apk/github/release -type f -name '*.apk' ! -name '*-unsigned.apk' | sort | head -1 || true)
          fi

          if [ -z "$PHONE_APK" ]; then
            echo "::error::No signed phone APK was produced for the '$BUILD_TARGET' build." >&2
            exit 1
          fi
          cp "$PHONE_APK" release-assets/british-radio-player.apk

          # The asset name must contain "wear": the in-app updater falls back to "any .apk that
          # is not the watch app" when the canonical name is missing.
          WEAR_APK=$(find wear/build/outputs/apk/release -type f -name '*.apk' ! -name '*-unsigned.apk' | sort | head -1 || true)
          if [ -z "$WEAR_APK" ]; then
            echo "::error::No signed Wear OS APK was produced." >&2
            exit 1
          fi
          cp "$WEAR_APK" release-assets/wear-british-radio-player.apk

          ls -lh release-assets

      - name: Publish / update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          WEAR_VERSION_CODE: ${{ steps.version.outputs.wear_version_code }}
          BUILD_TARGET: ${{ steps.version.outputs.build_target }}
        run: |
          set -euo pipefail

          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -1 || true)
          TITLE="British Radio Player (${TAG})"

          # Generate the notes from the commits in this release.
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:'%s' --no-merges "${PREV_TAG}..${TAG}" 2>/dev/null || true)
          else
            COMMITS=$(git log --pretty=format:'%s' --no-merges -20 "${TAG}" 2>/dev/null || true)
          fi

          NOTES_FILE=$(mktemp)
          {
            echo "## British Radio Player (${TAG})"
            echo
            echo "### 📦 Version matrix"
            echo "- Phone app: ${VERSION_NAME} (build ${VERSION_CODE})"
            echo "- Wear OS app: ${VERSION_NAME} (build ${WEAR_VERSION_CODE})"
            echo
          } > "$NOTES_FILE"

          if [ "$BUILD_TARGET" = "kotlin" ]; then
            {
              echo "### 🧱 Build"
              echo "- This release was built from the legacy Kotlin app (\`build_target: kotlin\`)."
              echo
            } >> "$NOTES_FILE"
          fi

          emit_section() {
            local heading="$1"
            local pattern="$2"
            local matches
            matches=$(printf '%s\n' "$COMMITS" | grep -E "$pattern" || true)
            if [ -n "$matches" ]; then
              {
                echo "### ${heading}"
                printf '%s\n' "$matches" | sed -E 's/^([a-z]+)(\([^)]*\))?!?: ?/- /' | sed 's/^/  /'
                echo
              } >> "$NOTES_FILE"
            fi
          }

          emit_section "✨ Features" '^(feat|feature)(\([^)]*\))?!?:'
          emit_section "🐛 Fixes" '^fix(\([^)]*\))?!?:'
          emit_section "🔧 Maintenance" '^(chore|build|ci|refactor|perf|test|docs|revert|release)(\([^)]*\))?!?:'
          emit_section "📦 Other changes" '^(feat|feature|fix|chore|build|ci|refactor|perf|test|docs|revert|release)(\([^)]*\))?!?:|^[^:]+:'

          {
            echo "### 📥 Artifacts"
            echo "- \`british-radio-player.apk\` — phone and Android Auto"
            echo "- \`wear-british-radio-player.apk\` — Wear OS companion"
            echo
            echo "The phone APK is signed with the shared community key so sideloaded builds keep"
            echo "upgrading in place. Google Play users get the same app from the Play listing."
          } >> "$NOTES_FILE"

          if [ -n "$PREV_TAG" ]; then
            {
              echo
              echo "**Full changelog**: https://github.com/hyliankid14/British-Radio-Player/compare/${PREV_TAG}...${TAG}"
            } >> "$NOTES_FILE"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              release-assets/british-radio-player.apk \
              release-assets/wear-british-radio-player.apk \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          else
            gh release upload "$TAG" release-assets/british-radio-player.apk --clobber
            gh release upload "$TAG" release-assets/wear-british-radio-player.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          fi

          rm -f "$NOTES_FILE"

      - name: Summarise the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## 📦 ${TAG} published"
            echo ""
            echo "| Artifact | Channel | Signing |"
            echo "|---|---|---|"
            echo "| \`british-radio-player.apk\` | GitHub (in-app updater on) | shared community key |"
            echo "| \`wear-british-radio-player.apk\` | GitHub | ${{ steps.wear_keystore.outputs.has_signing == 'true' && 'Play upload key' || 'shared community key' }} |"
            echo ""
            echo "Google Play builds are produced separately by \`build-play-aab.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
