name: Build and Publish Release APKs and AABs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.9.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: version
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          REF_NAME="${{ github.ref_name }}"
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ -z "$TAG" || "$TAG" == "main" ]]; then
            TAG_NAME=$(grep -Po '(?<=APP_VERSION_NAME=).+' gradle.properties)
            TAG="v${TAG_NAME}"
          fi
          echo "Building for tag: $TAG"
          VERSION_NAME="${TAG#v}"
          VERSION_CODE=$(grep -Po '(?<=APP_VERSION_CODE=).+' gradle.properties)
          WEAR_VERSION_CODE=$(( VERSION_CODE * 10 + 1 ))
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "wear_version_code=${WEAR_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Release Keystore (if secrets configured)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ]; then
            mkdir -p /tmp/keystores
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/keystores/release.jks
            chmod 600 /tmp/keystores/release.jks
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "store_file=/tmp/keystores/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android Phone release APK/AAB and Wear OS release APK/AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          GRADLE_ARGS=(
            ":app:assembleGithubRelease"
            ":wear:assembleRelease"
            ":app:bundlePlayRelease"
            ":wear:bundleRelease"
            "-PAPP_VERSION_NAME=${{ steps.version.outputs.version_name }}"
            "-PAPP_VERSION_CODE=${{ steps.version.outputs.version_code }}"
            "-PWEAR_VERSION_CODE=${{ steps.version.outputs.wear_version_code }}"
            "-PGCS_INDEX_URL=https://raspberrypi.tailc23afa.ts.net:8443/data/podcast-index.json.gz"
            "-PGCS_META_URL=https://raspberrypi.tailc23afa.ts.net:8443/data/podcast-index-meta.json"
            "-PGCS_STATS_URL=https://raspberrypi.tailc23afa.ts.net:8443/data/popular-podcasts.json"
            "-PGCS_NEW_PODCASTS_URL=https://raspberrypi.tailc23afa.ts.net:8443/data/new-podcasts.json"
            "-PCLOUD_FUNCTION_URL=https://raspberrypi.tailc23afa.ts.net:8443"
          )

          if [ "${{ steps.keystore.outputs.has_signing }}" = "true" ]; then
            GRADLE_ARGS+=(
              "-PRELEASE_STORE_FILE=${{ steps.keystore.outputs.store_file }}"
              "-PRELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
              "-PRELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
              "-PRELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
            )
          fi

          ./gradlew "${GRADLE_ARGS[@]}"

      - name: Package Native Debug Symbols and Prepare Assets
        id: assets
        run: |
          mkdir -p release-assets play-console-assets
          TAG="${{ steps.version.outputs.tag }}"
          
          # 1. Phone APK
          PHONE_APK=$(find app/build/outputs/apk/github/release -name "*.apk" ! -name "*-unsigned.apk" | head -1 || true)
          if [ -n "$PHONE_APK" ]; then
            cp "$PHONE_APK" release-assets/british-radio-player.apk
            cp "$PHONE_APK" release-assets/android-british-radio-player.apk
          fi
          
          # 2. Wear APK
          WEAR_APK=$(find wear/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -1 || true)
          if [ -n "$WEAR_APK" ]; then
            cp "$WEAR_APK" release-assets/wear-british-radio-player.apk
          fi
          
          # 3. Phone Google Play AAB
          PHONE_AAB=$(find app/build/outputs/bundle/playRelease -name "*.aab" | head -1 || true)
          if [ -n "$PHONE_AAB" ]; then
            cp "$PHONE_AAB" "release-assets/british-radio-player-${TAG}-play-release.aab"
            cp "$PHONE_AAB" play-console-assets/app-play-release.aab
          fi
          
          # 4. Wear Google Play AAB
          WEAR_AAB=$(find wear/build/outputs/bundle/release -name "*.aab" | head -1 || true)
          if [ -n "$WEAR_AAB" ]; then
            cp "$WEAR_AAB" "release-assets/wear-british-radio-player-${TAG}-release.aab"
            cp "$WEAR_AAB" play-console-assets/wear-release.aab
          fi
          
          # 5. Mapping files (ProGuard / R8)
          if [ -f "app/build/outputs/mapping/playRelease/mapping.txt" ]; then
            cp "app/build/outputs/mapping/playRelease/mapping.txt" "release-assets/mapping-${TAG}.txt"
            cp "app/build/outputs/mapping/playRelease/mapping.txt" play-console-assets/mapping.txt
          fi
          if [ -f "wear/build/outputs/mapping/release/mapping.txt" ]; then
            cp "wear/build/outputs/mapping/release/mapping.txt" "release-assets/wear-mapping-${TAG}.txt"
            cp "wear/build/outputs/mapping/release/mapping.txt" play-console-assets/wear-mapping.txt
          fi
          
          # 6. Native debug symbols
          NATIVE_LIBS_DIR="app/build/intermediates/merged_native_libs/playRelease/mergePlayReleaseNativeLibs/out/lib"
          if [ -d "$NATIVE_LIBS_DIR" ]; then
            (cd "$NATIVE_LIBS_DIR" && zip -rq "$GITHUB_WORKSPACE/release-assets/native-debug-symbols-${TAG}.zip" .)
            cp "$GITHUB_WORKSPACE/release-assets/native-debug-symbols-${TAG}.zip" play-console-assets/native-debug-symbols.zip
          elif [ -f "app/build/outputs/native-debug-symbols/playRelease/native-debug-symbols.zip" ]; then
            cp "app/build/outputs/native-debug-symbols/playRelease/native-debug-symbols.zip" "release-assets/native-debug-symbols-${TAG}.zip"
            cp "app/build/outputs/native-debug-symbols/playRelease/native-debug-symbols.zip" play-console-assets/native-debug-symbols.zip
          fi
          
          ls -lh release-assets
          ls -lh play-console-assets

      - name: Upload Play Console Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: google-play-release-bundle-${{ steps.version.outputs.tag }}
          path: play-console-assets/*

      - name: Publish / Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -1 || true)
          TITLE="British Radio Player (${TAG})"
          
          NOTES_FILE=$(mktemp)
          cat << 'EOF' > "$NOTES_FILE"
          ## British Radio Player (${{ steps.version.outputs.tag }})

          ### 📴 Offline Mode
          - Full offline mode support with network connectivity detection and app-wide offline warning banner
          - Dedicated Downloaded Files section in Playlists for easy offline access
          - Offline-filtered podcast episode feeds and hide empty playlists when offline

          ### 🎧 Audio Service & Playback
          - Auto-resume playback after transient audio focus loss and improved transient detection

          ### 🔍 UI Polish & Search
          - Search suggestions dropdown with fast RecyclerView display
          - Adaptive artwork sizing across multiple screen form factors

          ### 📱 Wear OS Companion
          - Updated Wear OS release build with sync and performance updates

          ### 📦 Release Artifacts
          - `british-radio-player.apk` / `android-british-radio-player.apk`: Phone and Android Auto APK
          - `wear-british-radio-player.apk`: Wear OS companion APK
          - `british-radio-player-${{ steps.version.outputs.tag }}-play-release.aab`: Google Play App Bundle with native debug symbols & 16 KB page alignment
          - `wear-british-radio-player-${{ steps.version.outputs.tag }}-release.aab`: Wear OS Google Play App Bundle
          - `native-debug-symbols-${{ steps.version.outputs.tag }}.zip`: Native crash/ANR debug symbols for Play Console
          - `mapping-${{ steps.version.outputs.tag }}.txt`: ProGuard/R8 deobfuscation mapping file
          EOF

          if [ -n "$PREV_TAG" ]; then
            echo "" >> "$NOTES_FILE"
            echo "**Full Changelog**: https://github.com/hyliankid14/British-Radio-Player/compare/${PREV_TAG}...${TAG}" >> "$NOTES_FILE"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          fi

          for f in release-assets/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f to release $TAG..."
              gh release upload "$TAG" "$f" --clobber
            fi
          done
          
          rm -f "$NOTES_FILE"
