name: Build Debug APK

# Builds a debug APK for sideloading on a device.  The APK is signed with the shared debug
# keystore (keystore/debug.keystore, copied into the generated project by the
# withAndroidCleartextTraffic config plugin) so CI and local builds share the same key and can
# upgrade-in-place without reinstalling.
#
# The debug build type carries the ".debug" application id suffix, so a debug sideload can live
# alongside the release app installed from GitHub or Google Play.
#
# After a successful build the APK is published as a GitHub pre-release asset under the rolling
# tag "debug-apk-latest".  Pre-release assets have a direct browser_download_url (no zip, no
# GitHub login required) that works in any browser — including the GitHub mobile app.

on:
  workflow_dispatch:       # allow manual trigger from the Actions tab
    inputs:
      build_target:
        description: 'react = React Native app (default). kotlin = legacy Kotlin app, opt-in only.'
        required: false
        type: choice
        default: react
        options:
          - react
          - kotlin
  # Automatic builds on push disabled:
  # push:
  #   branches:
  #     - main

permissions:
  contents: write          # needed to create/update the rolling debug-apk-latest release

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history required so 'git describe' can find tags

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew react-app/android/gradlew

      # react-app/app.json is the single source of truth for the phone app version.
      - name: Compute debug version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_VERSION=$(jq -r '.expo.version' react-app/app.json)

          if [[ "$RELEASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"

            # Bump patch by 1 so the debug build is always ahead of the release.
            VERSION_NAME="${MAJOR}.${MINOR}.$(( PATCH + 1 ))"
            echo "app.json version: ${RELEASE_VERSION} → debug version: ${VERSION_NAME}"
          else
            echo "::warning::app.json version '${RELEASE_VERSION}' is not semver; using it as-is." >&2
            VERSION_NAME="$RELEASE_VERSION"
          fi

          # A Unix timestamp as the version code lets every CI run upgrade in place without
          # uninstalling.  (Max allowed versionCode is 2,100,000,000; Unix time is ~1.7 B.)
          VERSION_CODE=$(date -u +%s)

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Install React app dependencies
        if: inputs.build_target != 'kotlin'
        working-directory: react-app
        run: npm ci

      - name: Generate the React Native Android project
        if: inputs.build_target != 'kotlin'
        working-directory: react-app
        run: npx expo prebuild --platform android --no-install --clean

      - name: Point the generated project at the Android SDK
        if: inputs.build_target != 'kotlin'
        run: |
          # prebuild --clean regenerates android/, so sdk.dir is written fresh for this run.
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=${ANDROID_HOME}" > react-app/android/local.properties
          else
            echo "::error::ANDROID_HOME is not set on this runner." >&2
            exit 1
          fi

      - name: Build the React debug APK
        if: inputs.build_target != 'kotlin'
        working-directory: react-app/android
        env:
          EXPO_PUBLIC_DISTRIBUTION_CHANNEL: github
          EXPO_PUBLIC_LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          EXPO_PUBLIC_LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          set -euo pipefail
          # The JavaScript bundle is embedded in debug builds too (the generated project sets
          # `debuggableVariants = []`), so the APK runs without a Metro server.
          ./gradlew :app:assembleGithubDebug \
            -Pandroid.enableMinifyInDebugBuilds=true \
            -Pexpo.useLegacyPackaging=true

      - name: Build the legacy Kotlin debug APK
        if: inputs.build_target == 'kotlin'
        run: |
          set -euo pipefail
          ./gradlew assembleGithubDebug \
            -PAPP_VERSION_NAME="${{ steps.version.outputs.version_name }}" \
            -PAPP_VERSION_CODE="${{ steps.version.outputs.version_code }}" \
            -PPODCAST_API_BASE_URL="https://bbc-radio.shai.website" \
            -PLASTFM_API_KEY="${{ secrets.LASTFM_API_KEY }}" \
            -PLASTFM_API_SECRET="${{ secrets.LASTFM_API_SECRET }}"

      - name: Publish debug APK as rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ inputs.build_target }}
        run: |
          set -euo pipefail
          TAG="debug-apk-latest"

          if [ "$BUILD_TARGET" = "kotlin" ]; then
            APK=$(find app/build/outputs/apk/github/debug -name '*.apk' | sort | head -1)
          else
            APK=$(find react-app/android/app/build/outputs/apk/github/debug -maxdepth 1 -name '*.apk' | sort | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "::error::No debug APK was produced for the '${BUILD_TARGET}' build." >&2
            exit 1
          fi

          # Rename the APK to a fixed filename so the download URL is stable.
          DEST="$(dirname "$APK")/british-radio-player-debug.apk"
          cp "$APK" "$DEST"

          # Replace any previous rolling release so only one exists at a time.
          # --cleanup-tag deletes both the GitHub release and the associated git tag
          # atomically via the API, preventing "release already exists" errors.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          DEBUG_VERSION="${{ steps.version.outputs.version_name }}"
          NOTES="Rolling debug build \`v${DEBUG_VERSION}-debug\` — branch \`${{ github.ref_name }}\`, commit \`${{ github.sha }}\`."$'\n\n'"This is a pre-release used for sideloading only. It is not a production release."

          # Create a fresh pre-release and attach the APK directly (not zipped).
          gh release create "$TAG" "$DEST" \
            --title "Debug APK (v${DEBUG_VERSION}-debug)" \
            --notes "$NOTES" \
            --prerelease

          APK_URL=$(gh release view "$TAG" --json assets -q '.assets[0].browser_download_url')

          {
            echo "## 📱 Debug APK — direct download"
            echo ""
            echo "**Version: \`v${DEBUG_VERSION}-debug\`**"
            echo ""
            echo "**[⬇️ Download APK]($APK_URL)**"
            echo ""
            echo "Tap the link above to download the APK directly (no zip, no login required)."
            echo "This build is signed with the shared debug keystore — it will install"
            echo "over an existing debug build without needing to uninstall first."
            if [ "$BUILD_TARGET" = "kotlin" ]; then
              echo ""
              echo "Legacy Kotlin build (opt-in)."
            else
              echo ""
              echo "React Native build — application id \`com.hyliankid14.bbcradioplayer.debug\`,"
              echo "so it installs alongside the release app."
            fi
            echo ""
            echo "Branch: \`${{ github.ref_name }}\`  |  Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
