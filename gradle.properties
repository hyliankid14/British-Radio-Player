org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false

# R8/D8 Kotlin metadata compatibility
android.disableDexingArtifactTransform=false

# Performance optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Kotlin optimizations
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=false

# Android optimizations
android.defaults.buildfeatures.buildconfig=false

# Gradle 10+ compatibility
org.gradle.unsafe.isolated-projects=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Suppress AGP warning for compileSdk 36 (AGP 8.6.0 tested up to 35)
android.suppressUnsupportedCompileSdk=36

# Release version of the LEGACY KOTLIN phone app only.
#
# The phone app is built from react-app/.  react-app/app.json (expo.version and
# expo.android.versionCode) is the single source of truth for its version, and the release
# scripts and workflows read it from there.  The Wear OS companion is still built from :wear
# and receives -PAPP_VERSION_NAME / -PWEAR_VERSION_CODE explicitly.
#
# These keys remain so the legacy Kotlin app (build_target: kotlin) has a sane fallback; do not
# use them to version a release.
APP_VERSION_NAME=1.9.2
APP_VERSION_CODE=77

